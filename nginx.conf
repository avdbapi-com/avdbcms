# Full Nginx virtual host for manual VPS setup only.
#
# Use this when you edit the complete Nginx virtual-host file yourself, for
# example under /etc/nginx/sites-available/example.com. The web root is the
# project's public/ folder; replace /path/to/avdbcms (three places: the root line
# and the two alias lines) with the project folder, then run nginx -t before reloading.
# The same block, with comments for every rule: docs/server-configs/nginx-public-root.conf.
#
# Do not paste this file into aaPanel or CyberPanel "URL rewrite" boxes.
# Those boxes are included inside an existing server block. Use
# nginx-aapanel-rewrite.conf (next to this file) instead.

server {
    listen 80;
    server_name example.com www.example.com;

    root /path/to/avdbcms/public;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 1024M;

    # --- Compression: cut transfer size for all devices (especially mobile). ---
    # gzip ships in nginx core (ngx_http_gzip_module); the brotli directive is
    # omitted on purpose - an un-compiled `brotli` aborts nginx startup, which
    # would break the no-config installer. HTML is gzipped by nginx implicitly.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/ld+json application/vnd.ms-fontobject application/x-font-ttf font/ttf font/otf image/svg+xml image/x-icon;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # robots.txt (the site writes it when its SEO settings are saved): five minutes, as its route and public/.htaccess
    # give it, so a change reaches crawlers through a CDN within minutes (nginx's own answer for a file carries no
    # Cache-Control: Cloudflare kept it for two hours). Where the file is missing, the site's own route answers the text.
    location = /robots.txt {
        try_files $uri /index.php?$query_string;
        expires 5m;
    }

    # Uploaded public files (/storage/...): pictures only, never a script, a dump or a log.
    location ^~ /storage/ {
        alias /path/to/avdbcms/storage/app/public/;
        location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
        location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
        try_files $uri /index.php?$query_string;
        expires 1d;
    }

    # public/uploads, the upload folder of older releases: files only, never a script.
    location ^~ /uploads/ {
        location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
        location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
        try_files $uri =404;
        expires 1d;
    }

    # Video files stored on this server, handed to nginx by PHP (X-Accel-Redirect); never reachable directly.
    location ^~ /_internal/ {
        internal;
        alias /path/to/avdbcms/storage/app/private/;
    }

    # The site's own addresses that end like a file (a video, a backup download) always reach the application.
    location ^~ /video/file/ {
        rewrite ^ /index.php last;
    }
    location ^~ /admin/ {
        rewrite ^ /index.php last;
    }

    # Database dumps, logs and backup copies are never handed out; the site's own addresses that end like that
    # (an admin's download of a backup or a log) still reach the application.
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ {
        rewrite ^ /index.php last;
    }

    # Never the project's source, even if the web root is changed to the project folder by mistake.
    location ~* ^/(app|bootstrap|config|database|lang|resources|routes|tests|bin|node_modules)/ { return 404; }
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|artisan)$ { return 404; }

    # Dotfiles in any folder, before PHP; ACME challenges under /.well-known/ still work.
    location ~ /\.(?!well-known/) { return 404; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Long cache for fingerprinted Vite build assets (content-hashed, immutable).
    location ~* ^/build/.*\.(css|js|woff2?|ttf|svg|png|jpe?g|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
