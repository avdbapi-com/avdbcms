# Full Nginx virtual host for manual VPS setup only.
#
# Use this when you edit the complete Nginx virtual-host file yourself, for
# example under /etc/nginx/sites-available/example.com.
#
# Do not paste this file into aaPanel or CyberPanel "URL rewrite" boxes.
# Those boxes are included inside an existing server block. Use
# docs/server-configs/nginx-aapanel-rewrite.conf instead.

server {
    listen 80;
    server_name example.com www.example.com;

    root /path/to/avdbcms/public;
    index index.php index.html;

    client_max_body_size 1024M;

    # --- Compression: cut transfer size for all devices (especially mobile). ---
    # gzip ships in nginx core (ngx_http_gzip_module); the brotli directive is
    # omitted on purpose - an un-compiled `brotli` aborts nginx startup, which
    # would break the no-config installer. HTML is gzipped by nginx implicitly.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/ld+json application/vnd.ms-fontobject application/x-font-ttf font/ttf font/otf image/svg+xml image/x-icon;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Guard users who accidentally point Nginx at the project root.
    # The correct root is /path/to/avdbcms/public.
    location ~* ^/(app|bootstrap|config|database|resources|routes|storage|vendor)/ {
        deny all;
    }

    location ~* ^/(\.env|composer\.(json|lock)|package(-lock)?\.json|artisan)$ {
        deny all;
    }

    # Long cache for fingerprinted Vite build assets (content-hashed, immutable).
    location ~* ^/build/.*\.(css|js|woff2?|ttf|svg|png|jpe?g|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
