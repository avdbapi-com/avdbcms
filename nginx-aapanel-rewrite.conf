# aaPanel / CyberPanel / CloudPanel - Nginx URL rewrite snippet.
#
# Paste only the location block below into:
#   Website > your site > URL rewrite
#
# Do not paste a full "server { }" block here. aaPanel stores this file under:
#   /www/server/panel/vhost/rewrite/<domain>.conf
# and includes it inside the existing server block.
#
# A nested server block causes:
#   nginx: [emerg] "server" directive is not allowed here
#
# Required panel settings:
#   1. Website > your site > Directory
#      Site directory:    /www/wwwroot/your-domain.com
#      Running directory: /public
#   2. Website > your site > PHP version
#      Select PHP 8.3 or newer.
#   3. Website > your site > Directory > Anti-XSS attack/open_basedir
#      Disable if it blocks Laravel from reading vendor/, storage/, or config/.
#   4. Website > your site > URL rewrite
#      Paste only the location block below.
#   5. Optional upload limit:
#      App Store > Nginx > Settings > Optimization > client_max_body_size.

# --- Compression: cut transfer size for all devices (especially mobile). ---
# gzip ships in nginx core; brotli is omitted on purpose (an un-compiled
# `brotli` directive aborts nginx startup). HTML is gzipped by nginx implicitly.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/ld+json application/vnd.ms-fontobject application/x-font-ttf font/ttf font/otf image/svg+xml image/x-icon;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}
