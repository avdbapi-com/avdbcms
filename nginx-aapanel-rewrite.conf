# aaPanel / CyberPanel / CloudPanel - Nginx URL rewrite snippet.
#
# Paste only the location blocks below into:
#   Website > your site > URL rewrite
#
# Do not paste a full "server { }" block here. aaPanel stores this file under:
#   /www/server/panel/vhost/rewrite/<domain>.conf
# and includes it inside the existing server block.
#
# A nested server block causes:
#   nginx: [emerg] "server" directive is not allowed here
#
# Required panel settings:
#   1. Website > your site > Directory
#      Site directory:    /www/wwwroot/your-domain.com
#      Running directory: /public
#   2. Website > your site > PHP version
#      Select PHP 8.3 or newer.
#   3. Website > your site > Directory > Anti-XSS attack/open_basedir
#      Disable if it blocks Laravel from reading vendor/, storage/, or config/.
#   4. Website > your site > URL rewrite
#      Paste only the location blocks below, with __PROJECT_ROOT__ replaced by the
#      site directory (for example /www/wwwroot/your-domain.com, two places).
#      Without that the site still works: PHP then hands out the uploaded pictures
#      and streams the videos stored on the server itself.
#   5. Optional upload limit:
#      App Store > Nginx > Settings > Optimization > client_max_body_size.
#
# CloudPanel with the Document Root /public: paste these locations (with __PROJECT_ROOT__ replaced) into the SECOND
# server { } block of the site's Vhost (the one with "listen 8080"), above its PHP location, and
# docs/server-configs/nginx-cloudpanel-front.conf into the first (COMMUNITY_SETUP_GUIDE.md, Panel 4).
#
# ONLY for the Running directory /public. When the Running directory stays "/"
# (the site directory itself), do not use this file: use
# docs/server-configs/nginx-project-root.conf ALONE instead (in this box or in
# aaPanel's extension folder), and never both: nginx -t refuses the pair (gzip and
# the locations twice). The application also writes those rules into the URL
# rewrite file itself when PHP may.

# --- Compression: cut transfer size for all devices (especially mobile). ---
# gzip ships in nginx core; brotli is omitted on purpose (an un-compiled
# `brotli` directive aborts nginx startup). HTML is gzipped by nginx implicitly.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/ld+json application/vnd.ms-fontobject application/x-font-ttf font/ttf font/otf image/svg+xml image/x-icon;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Uploaded public files (/storage/...), served straight from storage/app/public:
# pictures only, never a script, a dump or a log, and nothing else of storage/.
location ^~ /storage/ {
    alias __PROJECT_ROOT__/storage/app/public/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri /index.php?$query_string;
    expires 1d;
}

# public/uploads, the upload folder of older releases: files only, never a script.
location ^~ /uploads/ {
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri =404;
    expires 1d;
}

# Video files stored on this server, handed to nginx by PHP (X-Accel-Redirect);
# never reachable directly.
location ^~ /_internal/ {
    internal;
    alias __PROJECT_ROOT__/storage/app/private/;
}

# The site's own addresses that end like a file (a video stored on this server,
# an administrator's download of a backup) always reach the application, whatever
# static-file rule the panel adds.
location ^~ /video/file/ {
    rewrite ^ /index.php last;
}
location ^~ /admin/ {
    rewrite ^ /index.php last;
}

# Database dumps, logs and backup copies are never handed out; the site's own
# addresses that end like that (an admin's download of a backup or a log) still
# reach the application.
location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ {
    rewrite ^ /index.php last;
}

# Dotfiles in any folder (.env, .git, .user.ini ...); ACME challenges under
# /.well-known/ still work.
location ~ /\.(?!well-known/) { return 404; }

# Nothing below exists with the Running directory /public. It only matters when
# this file is used with the Running directory "/" by mistake: the upload folders
# under public/ never run a script, and the project's source and files are never
# served (the same rules as docs/server-configs/nginx-project-root.conf).
location ^~ /public/storage/ {
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri =404;
}
location ^~ /public/uploads/ {
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri =404;
}
location ^~ /app/ { return 404; }
location ^~ /bootstrap/ { return 404; }
location ^~ /config/ { return 404; }
location ^~ /database/ { return 404; }
location ^~ /docker/ { return 404; }
location ^~ /helpers/ { return 404; }
location ^~ /lang/ { return 404; }
location ^~ /resources/ { return 404; }
location ^~ /routes/ { return 404; }
location ^~ /tests/ { return 404; }
location ^~ /bin/ { return 404; }
location ^~ /node_modules/ { return 404; }
location ^~ /docs/ { return 404; }
location = /artisan { return 404; }
location = /composer.json { return 404; }
location = /composer.lock { return 404; }
location = /package.json { return 404; }
location = /package-lock.json { return 404; }
location = /phpunit.xml { return 404; }
location = /vite.config.js { return 404; }
location = /vite.config.ts { return 404; }
location = /docker-compose.yml { return 404; }
location = /nginx.conf { return 404; }
location = /nginx-aapanel-rewrite.conf { return 404; }
