# AVDBCMS - HestiaCP (nginx in front of Apache): nginx rules for a site whose document root is the PROJECT FOLDER
# (/home/<user>/web/<domain>/public_html, the folder that contains artisan). Prefer a custom document root on public/
# (COMMUNITY_SETUP_GUIDE.md, Panel 5): then nginx needs no file of the package at all.
#
# Apache reads the project folder's .htaccess (clean addresses, the closed folders, the upload folders); nginx in
# front hands out the files whose endings are in the domain's "Proxy Extensions" itself, straight from the project
# folder. These locations keep it to the public files: the uploaded pictures come from storage/app/public (never the
# backups, logs or private videos of storage/), published assets from public/vendor, and the project's own folders and
# files are never handed out.
#
# Install:
#   1. Replace __PROJECT_ROOT__ with the project folder, /home/<user>/web/<domain>/public_html (four places).
#   2. Save it as /home/<user>/conf/web/<domain>/nginx.conf_avdbcms AND nginx.ssl.conf_avdbcms (Hestia includes every
#      nginx.conf_* and nginx.ssl.conf_* file of that folder: never keep backup copies there).
#   3. Edit the web domain > Advanced options > Proxy Extensions: take out gz, tgz and tar, so that a database dump or
#      backup copy is answered by Apache, which refuses it; and txt, if it is in the list, so that robots.txt is
#      answered by Apache with the five-minute life public/.htaccess gives it (nginx's own answer for a file carries
#      no Cache-Control, and a CDN then keeps a changed robots.txt for hours).
#   4. nginx -t && systemctl reload nginx
#
# Not here, on purpose (unlike docs/server-configs/nginx-project-root.conf): no "location /" (Hestia's own sends every
# address to Apache: nginx -t refuses a second one) and no rewrite to /index.php (behind Hestia's proxy it reaches
# Apache as "/index.php": the admin and the videos stored on the server became the home page). The site's own
# addresses that end like a file (/video/file/<name>.mp4, an administrator's download of a backup) are not files on the
# disk, so Hestia's static-file location hands them to Apache as they are. No "location = /robots.txt" either: this
# server block has no root of its own, and Apache answers robots.txt through public/.htaccess (five minutes; step 3).
#
# tests/Unit/PanelNginxConfigsTest keeps these locations the same as the ones of nginx-project-root.conf.

# Uploaded public files (Storage::url() => /storage/...), served from storage/app/public. Pictures only: a script there
# never runs, a dump or log is never handed out.
location ^~ /storage/ {
    alias __PROJECT_ROOT__/storage/app/public/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri =404;
    expires 1d;
}

# public/uploads, the upload folder of older releases (updates keep it): files only, never a script. (The same folders
# under their public/ path are Apache's: the project folder's .htaccess refuses scripts and dumps there.)
location ^~ /uploads/ {
    alias __PROJECT_ROOT__/public/uploads/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri =404;
}

# Video files stored on this server go through PHP, which runs in Apache here: Apache streams them. The internal
# location only matters when PHP answers through nginx; visitors can never ask for /_internal/ themselves.
location ^~ /_internal/ {
    internal;
    alias __PROJECT_ROOT__/storage/app/private/;
}

# Published package assets (Horizon, Log Viewer, Umami) live in public/vendor. The composer vendor/ source tree is
# never served.
location ^~ /vendor/ {
    alias __PROJECT_ROOT__/public/vendor/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    try_files $uri =404;
}

# Application source, configuration, tests, dotfiles (in any folder, public/ too; ACME challenges under /.well-known/
# still work) and install data.
location ~ /\.(?!well-known/) { return 404; }
location ^~ /app/ { return 404; }
location ^~ /bootstrap/ { return 404; }
location ^~ /config/ { return 404; }
location ^~ /database/ { return 404; }
location ^~ /docker/ { return 404; }
location ^~ /helpers/ { return 404; }
location ^~ /lang/ { return 404; }
location ^~ /resources/ { return 404; }
location ^~ /routes/ { return 404; }
location ^~ /tests/ { return 404; }
location ^~ /bin/ { return 404; }
location ^~ /node_modules/ { return 404; }
location ^~ /docs/ { return 404; }
location = /artisan { return 404; }
location = /composer.json { return 404; }
location = /composer.lock { return 404; }
location = /package.json { return 404; }
location = /package-lock.json { return 404; }
location = /phpunit.xml { return 404; }
location = /vite.config.js { return 404; }
location = /vite.config.ts { return 404; }
location = /docker-compose.yml { return 404; }
location = /nginx.conf { return 404; }
location = /nginx-aapanel-rewrite.conf { return 404; }
location = /php-cli.ini { return 404; }
location = /web.config { return 404; }
location = /README.md { return 404; }
location = /COMMUNITY_SETUP_GUIDE.md { return 404; }
location = /UPGRADE.md { return 404; }
location = /CHANGELOG.md { return 404; }
location = /LICENSE { return 404; }
location = /NOTICE { return 404; }
location = /avdbcms-manifest.json { return 404; }
