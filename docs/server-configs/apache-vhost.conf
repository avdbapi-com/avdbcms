# AVDBCMS - Apache 2.4 virtual host for the RECOMMENDED layout: web root = <project>/public.
# Requires mod_rewrite (public/.htaccess does the routing). Add the TLS variant as usual.
<VirtualHost *:80>
    ServerName example.com
    DocumentRoot /var/www/example.com/public

    <Directory /var/www/example.com/public>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Never serve the rest of the project even if someone changes DocumentRoot later.
    <Directory /var/www/example.com>
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/example.com-error.log
    CustomLog ${APACHE_LOG_DIR}/example.com-access.log combined
</VirtualHost>

# FALLBACK layout (DocumentRoot = project root, e.g. public_html on shared hosting):
# no vhost change is needed. The shipped root .htaccess rewrites everything into
# public/, forwards /storage/* and /vendor/* and blocks source files. It needs:
#   - AllowOverride All (or at least FileInfo) on the project directory
#   - mod_rewrite enabled
#   - Options +FollowSymLinks or +SymLinksIfOwnerMatch (public/storage is a symlink
#     owned by the site user, so SymLinksIfOwnerMatch, Virtualmin's default, works)
# OpenLiteSpeed (aaPanel, CyberPanel) caches .htaccess: run
#   /usr/local/lsws/bin/lswsctrl restart
# after replacing the file, otherwise the old rules stay active.
