# AVDBCMS - CloudPanel (nginx): locations for the FIRST server { } block of the site's vhost, the one whose
# "location /" proxies to http://127.0.0.1:8080 (the second block, "listen 8080", runs PHP and gets the site's own
# rules: nginx-aapanel-rewrite.conf with the Document Root /public, docs/server-configs/nginx-project-root.conf with
# the project folder as Document Root; COMMUNITY_SETUP_GUIDE.md, Panel 4). For both Document Roots.
#
# Install (CloudPanel > the site > Vhost):
#   1. Replace __PROJECT_ROOT__ with the project folder (the one that contains artisan), for example
#      /home/site-user/htdocs/yourdomain.com (three places).
#   2. If CloudPanel's own "location /" proxies to another address than http://127.0.0.1:8080 (Varnish Cache on), use
#      that address in "location @avdbcms_app" too.
#   3. Paste these locations into the first server { } block ABOVE CloudPanel's own
#      "location ~* ^.+\.(css|js|jpg|...|gz|...|mp4|...|zip|...)$" block, which hands out files of the Document Root
#      itself, then save (CloudPanel tests and reloads nginx).
#
# Why: that block answers every address that ends like such a file from the disk. The site's own addresses that end
# like that (a video stored on this server, /video/file/<name>.mp4; an administrator's download of a backup) then ended
# on a 404, a database dump or backup copy in the folder was handed out, and a rewrite to /index.php in this block
# reaches PHP as "/index.php" (the address is lost on the way to the second block). Here they go to the second block
# as they are.
#
# tests/Unit/PanelNginxConfigsTest keeps these rules the same as the other nginx files of docs/server-configs/.

# The site's own addresses that end like a file, and every address through /index.php (a site whose links carry it, the
# admin opened as /index.php/admin/...): to the application, unchanged.
location ^~ /index.php/ {
    try_files /.avdbcms-application @avdbcms_app;
}
location ^~ /video/file/ {
    try_files /.avdbcms-application @avdbcms_app;
}
location ^~ /admin/ {
    try_files /.avdbcms-application @avdbcms_app;
}

# robots.txt (the site writes the file when its SEO settings are saved): five minutes, as its route and
# public/.htaccess give it, so a change reaches crawlers through a CDN within minutes (CloudPanel's own static-file
# block answered it with no Cache-Control: Cloudflare kept it for two hours). Where the file is missing, the
# application answers the same text.
location = /robots.txt {
    try_files $uri @avdbcms_app;
    expires 5m;
}

# Uploaded public files (Storage::url() => /storage/...), served from storage/app/public (also without the
# public/storage link). Pictures only: a script there never runs, a dump or log is never handed out; a file that is not
# there goes to the application (its storage.fallback route).
location ^~ /storage/ {
    alias __PROJECT_ROOT__/storage/app/public/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri @avdbcms_app;
    expires 1d;
}

# public/uploads, the upload folder of older releases (updates keep it): files only, never a script.
location ^~ /uploads/ {
    alias __PROJECT_ROOT__/public/uploads/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri =404;
    expires 1d;
}

# Published assets of packages (/vendor/...) come from public/vendor, never the project's vendor/ folder.
location ^~ /vendor/ {
    alias __PROJECT_ROOT__/public/vendor/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    try_files $uri =404;
}

# A database dump, a log or a backup copy is never handed out (an administrator's download of a backup is under
# /admin/ above and reaches the application).
location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }

# Dotfiles in any folder (.env, .htaccess, .user.ini ...); ACME challenges under /.well-known/ still work.
location ~ /\.(?!well-known/) { return 404; }

# The project's folders and files (with the project folder as Document Root they are next to index.php; the package's
# documents and its file list too: round 3 R3-039).
location ^~ /app/ { return 404; }
location ^~ /bootstrap/ { return 404; }
location ^~ /config/ { return 404; }
location ^~ /database/ { return 404; }
location ^~ /docker/ { return 404; }
location ^~ /docs/ { return 404; }
location ^~ /helpers/ { return 404; }
location ^~ /lang/ { return 404; }
location ^~ /node_modules/ { return 404; }
location ^~ /resources/ { return 404; }
location ^~ /routes/ { return 404; }
location ^~ /tests/ { return 404; }
location ^~ /bin/ { return 404; }
location = /artisan { return 404; }
location = /composer.json { return 404; }
location = /composer.lock { return 404; }
location = /package.json { return 404; }
location = /package-lock.json { return 404; }
location = /phpunit.xml { return 404; }
location = /vite.config.js { return 404; }
location = /vite.config.ts { return 404; }
location = /docker-compose.yml { return 404; }
location = /nginx.conf { return 404; }
location = /nginx-aapanel-rewrite.conf { return 404; }
location = /php-cli.ini { return 404; }
location = /web.config { return 404; }
location = /README.md { return 404; }
location = /COMMUNITY_SETUP_GUIDE.md { return 404; }
location = /UPGRADE.md { return 404; }
location = /CHANGELOG.md { return 404; }
location = /LICENSE { return 404; }
location = /NOTICE { return 404; }
location = /avdbcms-manifest.json { return 404; }

# The second server { } block, unchanged address and the visitor's own address and host (the same headers as
# CloudPanel's own "location /").
location @avdbcms_app {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 720;
    proxy_send_timeout 720;
    proxy_read_timeout 720;
}
