# AVDBCMS - nginx rules for the FALLBACK layout where the site's web root is the
# PROJECT ROOT (the folder that contains artisan, app/, public/, storage/ ...).
#
# Prefer pointing the web root at <project>/public and using nginx-public-root.conf.
# Use this file only when the panel cannot do that.
#
# Install:
#   1. Replace __PROJECT_ROOT__ with the absolute project path (for example
#      /www/wwwroot/example.com). Inside containers (1Panel) use the container path.
#   2. Include the file inside the site's server { } block:
#        aaPanel     /www/server/panel/vhost/nginx/extension/<domain>/avdbcms.conf
#                    (every *.conf in that folder is included automatically) or the
#                    site's "URL rewrite" box (then this file only: never together
#                    with nginx-aapanel-rewrite.conf, nginx -t would refuse the pair).
#        CloudPanel  Vhost: paste it into the SECOND server { } block only (the one
#                    with `listen 8080`, where PHP runs), above its PHP location. The
#                    first block (its `location /` proxies to :8080) gets
#                    docs/server-configs/nginx-cloudpanel-front.conf instead: a rewrite
#                    to /index.php there reaches PHP as "/index.php" (the admin pages
#                    and the videos stored on the server became the home page).
#        HestiaCP    do not use this file: use nginx-hestia-project-root.conf (no
#                    `location /` of its own: Hestia's sends everything to Apache, and
#                    nginx -t refuses a second one).
#        1Panel      save as /opt/1panel/www/sites/<site>/avdbcms.conf and add
#                    `include /www/sites/<site>/avdbcms.conf;` to
#                    /opt/1panel/www/conf.d/<site>.conf
#        Plesk       Domains > Apache & nginx Settings > Additional nginx directives
#      A site set up before 1.2.0 may already include these rules under an earlier
#      file name: update that file in place and never add a second copy under the
#      new name (nginx refuses duplicate locations, so nginx -t fails).
#   3. Test and reload: nginx -t && nginx -s reload
#      (1Panel: docker exec <openresty-container> nginx -t, then nginx -s reload)
#
# All deny rules use "^~" prefix locations or exact matches on purpose: they win over
# the panel's regex PHP handler (location ~ \.php$) whatever the include order, so no
# PHP file outside public/ can ever be executed or read, and no script in an upload
# folder ever runs. The two regular expressions (dotfiles; dumps, logs, backup copies)
# only have to come before a panel rule that serves the same names, if the panel has
# one.
#
# App\Support\AaPanelRewrite::rules() writes exactly these locations into aaPanel's
# rewrite file (tests/Unit/ServerConfigsTest keeps the two the same).

# --- Compression: cut transfer size for all devices (especially mobile). ---
# gzip ships in nginx core; brotli is omitted on purpose (an un-compiled
# `brotli` directive aborts nginx startup). HTML is gzipped by nginx implicitly.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/ld+json application/vnd.ms-fontobject application/x-font-ttf font/ttf font/otf image/svg+xml image/x-icon;

# Clean URLs: anything that is not a real file goes to the root index.php (Laravel).
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# robots.txt (the site writes the file when its SEO settings are saved): five
# minutes, as its route and public/.htaccess give it, so a change reaches crawlers
# through a CDN within minutes (nginx's own answer for a file carries no
# Cache-Control: Cloudflare kept it for two hours). Where the file is missing, the
# root index.php answers the same text.
location = /robots.txt {
    try_files $uri /index.php?$query_string;
    expires 5m;
}

# Uploaded public files (Storage::url() => /storage/...). Served straight from
# storage/app/public, so they work even when PHP symlink() is disabled and
# `php artisan storage:link` could not create public/storage.
# Pictures only: a script there never runs, a dump or log is never handed out.
location ^~ /storage/ {
    alias __PROJECT_ROOT__/storage/app/public/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri =404;
    expires 1d;
}

# The same folders under their public/ path, and public/uploads (the upload folder
# of older releases, kept by updates): files only, never a script.
location ^~ /public/storage/ {
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri =404;
}
location ^~ /public/uploads/ {
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri =404;
}
location ^~ /uploads/ {
    alias __PROJECT_ROOT__/public/uploads/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri =404;
}

# Video files stored on this server: PHP checks who may watch, then hands the
# file to nginx (X-Accel-Redirect). Visitors can never ask for /_internal/
# themselves. Without this block PHP streams the files itself (the site checks
# which one works: Tools > Health check, Streaming).
location ^~ /_internal/ {
    internal;
    alias __PROJECT_ROOT__/storage/app/private/;
}

# The site's own addresses that end like a file (a video stored on this server,
# /video/file/<name>.mp4; an administrator's download of a backup, .zip or .sql.gz)
# always reach the application, also where a panel's static-file rule (CloudPanel:
# location ~* ^.+\.(css|js|...|gz|mp4|...|zip)$) would answer them with a 404.
location ^~ /video/file/ {
    rewrite ^ /index.php last;
}
location ^~ /admin/ {
    rewrite ^ /index.php last;
}

# Published package assets (Horizon, Log Viewer, Umami) live in public/vendor.
# The composer vendor/ source tree is never served.
location ^~ /vendor/ {
    alias __PROJECT_ROOT__/public/vendor/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    try_files $uri =404;
}

# A database dump, a log or a backup copy is never handed out, wherever it lies.
# The site's own addresses that end like that (an admin's download of a backup or
# a log) still reach the application.
location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ {
    rewrite ^ /index.php last;
}

# Application source, configuration, tests, dotfiles (in any folder, public/ too;
# ACME challenges under /.well-known/ still work) and install data.
location ~ /\.(?!well-known/) { return 404; }
location ^~ /app/ { return 404; }
location ^~ /bootstrap/ { return 404; }
location ^~ /config/ { return 404; }
location ^~ /database/ { return 404; }
location ^~ /docker/ { return 404; }
location ^~ /helpers/ { return 404; }
location ^~ /lang/ { return 404; }
location ^~ /resources/ { return 404; }
location ^~ /routes/ { return 404; }
location ^~ /tests/ { return 404; }
location ^~ /bin/ { return 404; }
location ^~ /node_modules/ { return 404; }
location ^~ /docs/ { return 404; }
location = /artisan { return 404; }
location = /composer.json { return 404; }
location = /composer.lock { return 404; }
location = /package.json { return 404; }
location = /package-lock.json { return 404; }
location = /phpunit.xml { return 404; }
location = /vite.config.js { return 404; }
location = /vite.config.ts { return 404; }
location = /docker-compose.yml { return 404; }
location = /nginx.conf { return 404; }
location = /nginx-aapanel-rewrite.conf { return 404; }
location = /php-cli.ini { return 404; }
location = /web.config { return 404; }
location = /README.md { return 404; }
location = /COMMUNITY_SETUP_GUIDE.md { return 404; }
location = /UPGRADE.md { return 404; }
location = /CHANGELOG.md { return 404; }
location = /LICENSE { return 404; }
location = /NOTICE { return 404; }
location = /avdbcms-manifest.json { return 404; }
