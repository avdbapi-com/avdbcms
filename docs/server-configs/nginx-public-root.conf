# AVDBCMS - nginx server block for the RECOMMENDED layout: web root = <project>/public.
# Adjust server_name, the PHP-FPM socket and the TLS lines to your panel, and replace /var/www/example.com (three
# places: the root line and the two alias lines) with the project folder. Test with nginx -t before reloading.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    root /var/www/example.com/public;

    index index.php;
    charset utf-8;
    client_max_body_size 512m;

    # --- Compression: cut transfer size for all devices (especially mobile). ---
    # gzip ships in nginx core (ngx_http_gzip_module); the brotli directive is
    # omitted on purpose - an un-compiled `brotli` aborts nginx startup, which
    # would break the no-config installer. HTML is gzipped by nginx implicitly.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/ld+json application/vnd.ms-fontobject application/x-font-ttf font/ttf font/otf image/svg+xml image/x-icon;

    # Clean URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded public files when `php artisan storage:link` could not create the
    # public/storage symlink (symlink() disabled). Laravel also has a PHP fallback
    # route for /storage/*, so this block is an optimisation, not a requirement.
    # Pictures only: a script there never runs, a dump or log is never handed out.
    location ^~ /storage/ {
        alias /var/www/example.com/storage/app/public/;
        location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
        location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
        try_files $uri /index.php?$query_string;
        expires 1d;
    }

    # public/uploads, the upload folder of older releases (updates keep it): files only, never a script.
    location ^~ /uploads/ {
        location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
        location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
        try_files $uri =404;
        expires 1d;
    }

    # Video files stored on this server: PHP checks who may watch, then hands the file to nginx (X-Accel-Redirect).
    # Visitors can never ask for /_internal/ themselves. Without this block PHP streams the files itself (the site
    # checks which one works: Tools > Health check, Streaming).
    location ^~ /_internal/ {
        internal;
        alias /var/www/example.com/storage/app/private/;
    }

    # The site's own addresses that end like a file (a video stored on this server, /video/file/<name>.mp4; an
    # administrator's download of a backup) always reach the application, also next to a static-file rule a panel adds.
    location ^~ /video/file/ {
        rewrite ^ /index.php last;
    }
    location ^~ /admin/ {
        rewrite ^ /index.php last;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # robots.txt (the site writes the file when its SEO settings are saved): five minutes, as its route and
    # public/.htaccess give it, so a change reaches crawlers through a CDN within minutes (nginx's own answer for a
    # file carries no Cache-Control: Cloudflare kept it for two hours). Where the file is missing, the site's own
    # route answers the same text.
    location = /robots.txt {
        try_files $uri /index.php?$query_string;
        expires 5m;
        access_log off;
        log_not_found off;
    }

    # A database dump, a log or a backup copy is never handed out, even when one lands in public/. The site's own
    # addresses that end like that (an admin's download of a backup or a log) still reach the application.
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ {
        rewrite ^ /index.php last;
    }

    # Never the project's source, even if the web root is changed to the project folder by mistake.
    location ~* ^/(app|bootstrap|config|database|lang|resources|routes|tests|bin|node_modules)/ { return 404; }
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|artisan)$ { return 404; }

    # Dotfiles in any folder (.env, .git, .user.ini ...), before PHP so a dotfile script never runs; ACME challenges
    # under /.well-known/ still work.
    location ~ /\.(?!well-known/) { return 404; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Long cache for fingerprinted Vite assets
    location ~* ^/build/.*\.(css|js|woff2?|ttf|svg|png|jpe?g|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
