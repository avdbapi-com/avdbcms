# AVDBCMS - nginx server block for the RECOMMENDED layout: web root = <project>/public.
# Adjust server_name, root, the PHP-FPM socket and the TLS lines to your panel.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    root /var/www/example.com/public;

    index index.php;
    charset utf-8;
    client_max_body_size 512m;

    # --- Compression: cut transfer size for all devices (especially mobile). ---
    # gzip ships in nginx core (ngx_http_gzip_module); the brotli directive is
    # omitted on purpose - an un-compiled `brotli` aborts nginx startup, which
    # would break the no-config installer. HTML is gzipped by nginx implicitly.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/ld+json application/vnd.ms-fontobject application/x-font-ttf font/ttf font/otf image/svg+xml image/x-icon;

    # Clean URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded public files when `php artisan storage:link` could not create the
    # public/storage symlink (symlink() disabled). Laravel also has a PHP fallback
    # route for /storage/*, so this block is an optimisation, not a requirement.
    location ^~ /storage/ {
        alias /var/www/example.com/storage/app/public/;
        location ~ \.php$ { return 404; }
        try_files $uri /index.php?$query_string;
        expires 1d;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Dotfiles (but keep ACME challenges working)
    location ~ /\.(?!well-known).* { deny all; }

    # Long cache for fingerprinted Vite assets
    location ~* ^/build/.*\.(css|js|woff2?|ttf|svg|png|jpe?g|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
