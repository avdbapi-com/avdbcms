# AVDBCMS - nginx locations for a site installed in a FOLDER of a domain (https://example.com/site), served from the
# project's public/ folder. The domain's own root, its other sites and its own PHP stay as they are.
#
# Install:
#   1. Replace __PROJECT_ROOT__ with the project folder (the one that contains artisan), for example /var/www/avdbcms,
#      and /site with your folder's name (every line that has it). Keep the folder's name plain: letters, digits, "-"
#      and "_".
#   2. Replace unix:/run/php/php8.3-fpm.sock with the PHP-FPM socket of the site (PHP 8.3 or newer).
#   3. Paste these locations into the domain's server { } block (their "^~" prefixes keep the domain's own PHP and
#      static-file rules away from the folder), then run nginx -t and reload nginx.
#   4. Open https://example.com/site/install. The installer suggests https://example.com/site as the site's address
#      (APP_URL): keep it.
#
# Without rewrite rules (only /site/index.php/... reaches the site): in "location ^~ /site/" write
# "try_files $uri $uri/ =404;" and, in its dumps location, "return 404;" instead of the rewrite; in
# "location ^~ /site/storage/" write "try_files $uri =404;"; leave out the three locations that only rewrite
# (/site/video/file/, /site/admin/ and @avdbcms_site). The site then works at https://example.com/site/index.php/...
# and keeps that form in its links (it checks which form works).
#
# Search engines read robots.txt only at the domain's root: add "Sitemap: https://example.com/site/sitemap.xml" to the
# domain's own robots.txt, or submit the sitemap in their webmaster tools. Without rewrite rules the sitemap's address
# has /index.php, as every address of the site: "Sitemap: https://example.com/site/index.php/sitemap.xml".
#
# tests/Unit/SubFolderNginxConfigTest keeps the rules below the same as the other nginx files of docs/server-configs/.

# The folder's own address: with its slash.
location = /site { return 301 /site/$is_args$args; }

# Uploaded public files (Storage::url() => /site/storage/...), served from storage/app/public. Pictures only: a script
# there never runs, a dump or log is never handed out.
location ^~ /site/storage/ {
    alias __PROJECT_ROOT__/storage/app/public/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri @avdbcms_site;
    expires 1d;
}

# public/uploads, the upload folder of older releases (updates keep it): files only, never a script.
location ^~ /site/uploads/ {
    alias __PROJECT_ROOT__/public/uploads/;
    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ { return 404; }
    try_files $uri =404;
    expires 1d;
}

# Video files stored on this server: PHP checks who may watch, then hands the file to nginx (X-Accel-Redirect
# /_internal/...: an address of the server, not of the folder). Visitors can never ask for /_internal/ themselves.
# Without this block PHP streams the files itself (the site checks which one works: Tools > Health check, Streaming).
# One per server block: a second AVDBCMS site on the same domain leaves this block out (PHP then streams its videos).
location ^~ /_internal/ {
    internal;
    alias __PROJECT_ROOT__/storage/app/private/;
}

# The site's own addresses that end like a file (a video stored on this server, /site/video/file/<name>.mp4; an
# administrator's download of a backup) always reach the application, also next to a static-file rule a panel adds.
location ^~ /site/video/file/ {
    rewrite ^ /site/index.php last;
}
location ^~ /site/admin/ {
    rewrite ^ /site/index.php last;
}

# The front controller for the addresses that are no file (try_files with alias needs a named location: nginx would
# otherwise take the folder off the fallback address too).
location @avdbcms_site {
    rewrite ^ /site/index.php last;
}

# The site: a file of public/, else public/index.php (the clean addresses).
location ^~ /site/ {
    alias __PROJECT_ROOT__/public/;
    index index.php;
    try_files $uri $uri/ @avdbcms_site;

    # The front controller, also as /site/index.php/... (a server without rewrite rules). First: every address through
    # it reaches the application, also one that ends like a dump (an admin's download of a backup). No other script runs.
    location ~ ^/site/index\.php(/|$) {
        fastcgi_split_path_info ^(/site/index\.php)(/.*)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME __PROJECT_ROOT__/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }

    # A database dump, a log or a backup copy is never handed out, even when one lands in public/. The site's own
    # addresses that end like that (an admin's download of a backup or a log) still reach the application.
    location ~* (\.(sql|sqlite3?|db|dump|log|bak|backup|old|orig|save|swp|gz|tgz|tar)|~)$ {
        rewrite ^ /site/index.php last;
    }

    # Dotfiles in any folder (.env, .htaccess, .user.ini ...); ACME challenges under /.well-known/ still work.
    location ~ /\.(?!well-known/) { return 404; }

    location ~* \.ph(p[0-9]*|ar|tml|t|ps)(\.|/|$) { return 404; }

    # Long cache for fingerprinted Vite assets
    location ~* ^/site/build/.*\.(css|js|woff2?|ttf|svg|png|jpe?g|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
